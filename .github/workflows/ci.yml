name: Security & Quality CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── Gate 1: Secret Leak Prevention & Dependency Audit ─────────────────────
  security_audit:
    name: Secrets & Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit

  # ─── Gate 2: Multi-Python Version Test Matrix & Dogfooding ─────────────────
  test_matrix:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [security_audit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Package & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=maunprekshak --cov-report=xml

      - name: MaunPrekshak Dogfooding Self-Scan
        run: |
          mp scan . --ci --fail-on high --no-ai --exclude tests

      - name: Verify SARIF Export & Config Initialization
        run: |
          mp init --path /tmp
          mp scan . --output sarif --output-file /tmp/test-results.sarif --no-ai
          test -s /tmp/test-results.sarif
