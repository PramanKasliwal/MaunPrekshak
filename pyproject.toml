[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maunprekshak"
version = "0.1.0"
description = "The Silent Observer — Open-source Python security scanner for dependencies, secrets & insecure code"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Praman Kasliwal", email = "kasliwal.praman008@gmail.com" }]
keywords = ["security", "python", "vulnerability", "scanner", "sast", "secrets", "cve", "osv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "google-genai>=1.0.0",
    "reportlab>=4.2.0",
    "pyyaml>=6.0.1",
    "toml>=0.10.2",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
mp = "maunprekshak.cli.main:app"
maunprekshak = "maunprekshak.cli.main:app"

[project.urls]
Homepage = "https://github.com/PramanKasliwal/maunprekshak"
Repository = "https://github.com/PramanKasliwal/maunprekshak"
Issues = "https://github.com/PramanKasliwal/maunprekshak/issues"
Documentation = "https://github.com/PramanKasliwal/maunprekshak#readme"
