- id: maunprekshak
  name: MaunPrekshak Security Scanner
  description: The Silent Observer — Full project scanner for dependencies, secrets, and AST code vulnerabilities
  entry: mp scan . --ci --fail-on high --no-ai
  language: python
  types: [python]
  pass_filenames: false

- id: maunprekshak-secrets
  name: MaunPrekshak Secrets Detector
  description: Fast credential leak detector for API keys, tokens, and credentials
  entry: mp scan . --only secrets --ci --fail-on high --no-ai
  language: python
  pass_filenames: false
